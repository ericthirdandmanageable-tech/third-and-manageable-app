<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Continue password reset</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #faf8f5; color: #17172a; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      a { background: #040485; border-radius: 0.8rem; color: white; display: inline-block; font-weight: 700; margin-top: 1rem; padding: 0.9rem 1.25rem; text-decoration: none; }
      .error { color: #8b1a1a; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Continuing in the app…</h1>
      <p id="message">If the app does not open automatically, use the button below.</p>
      <a id="continue" hidden>Open Third &amp; Manageable</a>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const userId = params.get("userId");
        const secret = params.get("secret");
        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const link = document.getElementById("continue");

        if (!userId || !secret) {
          title.textContent = "This reset link is incomplete";
          message.textContent = "Request a new password-reset email from the app and open it on your device.";
          message.className = "error";
          return;
        }

        const destination = new URL("thirdandmanageableapp://reset-password");
        destination.searchParams.set("userId", userId);
        destination.searchParams.set("secret", secret);
        link.href = destination.toString();
        link.hidden = false;
        window.location.replace(destination.toString());
      })();
    </script>
  </body>
</html>
