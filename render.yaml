services:
  - type: web
    name: third-and-manageable-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: JWT_SECRET
        sync: false  # set in dashboard
      - key: GEMINI_API_KEY
        sync: false
      - fromDatabase:
          name: tm-db
          property: connectionString
        key: DATABASE_URL

databases:
  - name: tm-db
    plan: free
    databaseName: third_manageable
    user: tm